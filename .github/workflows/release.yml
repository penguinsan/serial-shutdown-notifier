name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          $version = $env:GITHUB_REF -replace 'refs/tags/', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --verbose

      - name: Create release package
        run: |
          mkdir release-package
          copy target\release\serial-shutdown-notifier.exe release-package\
          copy LICENSE release-package\
          copy README.md release-package\
          echo [serial] > release-package\config.toml
          echo port = "COM1" >> release-package\config.toml
          echo baud_rate = 9600 >> release-package\config.toml
          echo data_bits = 8 >> release-package\config.toml
          echo parity = "None" >> release-package\config.toml
          echo stop_bits = 1 >> release-package\config.toml
          echo. >> release-package\config.toml
          echo [message] >> release-package\config.toml
          echo shutdown_text = "SHUTDOWN\r" >> release-package\config.toml

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path release-package\* -DestinationPath serial-shutdown-notifier-${{ steps.get_version.outputs.version }}-windows-x64.zip
        shell: pwsh

      - name: Generate release notes
        id: release_notes
        run: |
          $notes = @"
          ## Serial Shutdown Notifier ${{ steps.get_version.outputs.version }}

          Windows service that sends a message via serial port on shutdown.

          ### Installation

          1. Download and extract the ZIP file
          2. Run ``serial-shutdown-notifier.exe install`` as administrator
          3. Start the service: ``sc start SerialShutdownNotifier``

          ### Files Included

          - ``serial-shutdown-notifier.exe`` - Main executable
          - ``config.toml`` - Configuration file
          - ``LICENSE`` - MIT License
          - ``README.md`` - Documentation

          ### Configuration

          Edit ``config.toml`` to customize serial port settings and shutdown message.

          For more information, see the [README](https://github.com/${{ github.repository }}/blob/main/README.md).
          "@
          $notes | Out-File -FilePath release_notes.txt -Encoding utf8
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.version }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            serial-shutdown-notifier-${{ steps.get_version.outputs.version }}-windows-x64.zip
            target/release/serial-shutdown-notifier.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
