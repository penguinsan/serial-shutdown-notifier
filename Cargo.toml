[package]
name = "bit-zeus-win"
version = "0.1.0"
edition = "2021"

[dependencies]
windows-service = "0.7"
serialport = "4.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Shutdown",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
